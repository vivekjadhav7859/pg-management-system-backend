service: pg-management-backend
frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-south-1
  stage: ${opt:stage, 'dev'}

  environment:
    STAGE: ${self:provider.stage}
    USER_POOL_ID: !Ref CognitoUserPool
    USER_POOL_CLIENT_ID: !Ref CognitoUserPoolClient
    USER_TABLE: ${self:service}-users-${self:provider.stage}
    PROPERTY_TABLE: ${self:service}-properties-${self:provider.stage}
    ROOM_TABLE: ${self:service}-rooms-${self:provider.stage}

  logs:
    httpApi: true

  iam:
    role:
      statements:
        # Cognito permissions
        - Effect: Allow
          Action:
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminInitiateAuth
            - cognito-idp:AdminSetUserPassword
            - cognito-idp:AdminGetUser
            - cognito-idp:GetUser
            - cognito-idp:GlobalSignOut
            - cognito-idp:AdminRespondToAuthChallenge
          Resource: "*"
        
        # DynamoDB permissions
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - !GetAtt UsersTable.Arn
            - !Sub "${UsersTable.Arn}/index/*"
            - !GetAtt PropertiesTable.Arn
            - !Sub "${PropertiesTable.Arn}/index/*"
            - !GetAtt RoomsTable.Arn
            - !Sub "${RoomsTable.Arn}/index/*"

build:
  esbuild:
    bundle: true
    minify: true
    sourcemap: false
    target: node20
    platform: node
    exclude:
      - aws-sdk

functions:
  # ============ AUTH ENDPOINTS ============
  signup:
    handler: src/functions/auth/signup.handler
    events:
      - http:
          path: auth/signup
          method: post
          cors: true

  login:
    handler: src/functions/auth/login.handler
    events:
      - http:
          path: auth/login
          method: post
          cors: true

  refreshToken:
    handler: src/functions/auth/refreshToken.handler
    events:
      - http:
          path: auth/refresh
          method: post
          cors: true

  logout:
    handler: src/functions/auth/logout.handler
    events:
      - http:
          path: auth/logout
          method: post
          cors: true

  verifyToken:
    handler: src/functions/auth/verifyToken.handler
    events:
      - http:
          path: auth/verify
          method: get
          cors: true

  getProfile:
    handler: src/functions/auth/getProfile.handler
    events:
      - http:
          path: auth/profile
          method: get
          cors: true

  updateProfile:
    handler: src/functions/auth/updateProfile.handler
    events:
      - http:
          path: auth/profile
          method: put
          cors: true

  # ============ ADMIN ENDPOINTS ============
  createAdmin:
    handler: src/functions/admin/createAdmin.handler
    events:
      - http:
          path: admin/create-user
          method: post
          cors: true

  # ============ PROPERTY MANAGEMENT ENDPOINTS ============
  addProperty:
    handler: src/functions/property/addProperty.handler
    events:
      - http:
          path: properties
          method: post
          cors: true

  getProperties:
    handler: src/functions/property/getProperties.handler
    events:
      - http:
          path: properties
          method: get
          cors: true

  getPropertyById:
    handler: src/functions/property/getPropertyById.handler
    events:
      - http:
          path: properties/{propertyId}
          method: get
          cors: true

  updateProperty:
    handler: src/functions/property/updateProperty.handler
    events:
      - http:
          path: properties/{propertyId}
          method: put
          cors: true

  deleteProperty:
    handler: src/functions/property/deleteProperty.handler
    events:
      - http:
          path: properties/{propertyId}
          method: delete
          cors: true

  # ============ ROOM MANAGEMENT ENDPOINTS ============
  addRoom:
    handler: src/functions/property/addRoom.handler
    events:
      - http:
          path: properties/{propertyId}/rooms
          method: post
          cors: true

  getRooms:
    handler: src/functions/property/getRooms.handler
    events:
      - http:
          path: properties/{propertyId}/rooms
          method: get
          cors: true

  getRoomById:
    handler: src/functions/property/getRoomById.handler
    events:
      - http:
          path: rooms/{roomId}
          method: get
          cors: true

  updateRoom:
    handler: src/functions/property/updateRoom.handler
    events:
      - http:
          path: rooms/{roomId}
          method: put
          cors: true

  deleteRoom:
    handler: src/functions/property/deleteRoom.handler
    events:
      - http:
          path: rooms/{roomId}
          method: delete
          cors: true

package:
  individually: true
  patterns:
    - '!node_modules/aws-sdk/**'
    - '!node_modules/.prisma/**'
    - '!node_modules/@aws-sdk/**'
    - '!tests/**'
    - '!docs/**'
    - '!.git/**'
    - '!.github/**'
    - '!coverage/**'
    - '!*.md'

resources:
  Resources:
    # ============ COGNITO USER POOL ============
    CognitoUserPool:
      Type: AWS::Cognito::UserPool
      DeletionPolicy: Delete
      Properties:
        UserPoolName: pg-mgmt-user-pool-${self:provider.stage}
        UsernameAttributes:
          - email
        AutoVerifiedAttributes:
          - email
        Schema:
          - Name: email
            AttributeDataType: String
            Mutable: false
          - Name: name
            AttributeDataType: String
            Mutable: true
          - Name: phone_number
            AttributeDataType: String
            Mutable: true
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireUppercase: true
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: true

    CognitoUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      DeletionPolicy: Delete
      Properties:
        ClientName: pg-mgmt-client-${self:provider.stage}
        UserPoolId: !Ref CognitoUserPool
        GenerateSecret: false
        ExplicitAuthFlows:
          - ADMIN_NO_SRP_AUTH
          - USER_PASSWORD_AUTH
        PreventUserExistenceErrors: ENABLED

    # ============ DYNAMODB TABLES ============
    
    # Users Table
    UsersTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Delete
      Properties:
        TableName: ${self:service}-users-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
          - AttributeName: cognitoUserId
            AttributeType: S
          - AttributeName: emailLowerCase
            AttributeType: S
          - AttributeName: userTypeIndex
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: CognitoUserIdIndex
            KeySchema:
              - AttributeName: cognitoUserId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: EmailIndex
            KeySchema:
              - AttributeName: emailLowerCase
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: UserTypeIndex
            KeySchema:
              - AttributeName: userTypeIndex
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        Tags:
          - Key: Environment
            Value: ${self:provider.stage}
          - Key: Service
            Value: ${self:service}

    # Properties Table
    PropertiesTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Delete
      Properties:
        TableName: ${self:service}-properties-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: propertyId
            AttributeType: S
          - AttributeName: ownerIdIndex
            AttributeType: S
          - AttributeName: statusIndex
            AttributeType: S
        KeySchema:
          - AttributeName: propertyId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: OwnerIdIndex
            KeySchema:
              - AttributeName: ownerIdIndex
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: StatusIndex
            KeySchema:
              - AttributeName: statusIndex
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        Tags:
          - Key: Environment
            Value: ${self:provider.stage}
          - Key: Service
            Value: ${self:service}

    # Rooms Table
    RoomsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Delete
      Properties:
        TableName: ${self:service}-rooms-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: roomId
            AttributeType: S
          - AttributeName: propertyIdIndex
            AttributeType: S
          - AttributeName: statusIndex
            AttributeType: S
        KeySchema:
          - AttributeName: roomId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: PropertyIdIndex
            KeySchema:
              - AttributeName: propertyIdIndex
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: StatusIndex
            KeySchema:
              - AttributeName: statusIndex
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        Tags:
          - Key: Environment
            Value: ${self:provider.stage}
          - Key: Service
            Value: ${self:service}

  Outputs:
    UserPoolId:
      Description: Cognito User Pool ID
      Value: !Ref CognitoUserPool
      Export:
        Name: ${self:service}-UserPoolId-${self:provider.stage}
    
    UserPoolClientId:
      Description: Cognito User Pool Client ID
      Value: !Ref CognitoUserPoolClient
      Export:
        Name: ${self:service}-UserPoolClientId-${self:provider.stage}
    
    UsersTableName:
      Description: DynamoDB Users Table Name
      Value: !Ref UsersTable
      Export:
        Name: ${self:service}-UsersTable-${self:provider.stage}
    
    PropertiesTableName:
      Description: DynamoDB Properties Table Name
      Value: !Ref PropertiesTable
      Export:
        Name: ${self:service}-PropertiesTable-${self:provider.stage}
    
    RoomsTableName:
      Description: DynamoDB Rooms Table Name
      Value: !Ref RoomsTable
      Export:
        Name: ${self:service}-RoomsTable-${self:provider.stage}