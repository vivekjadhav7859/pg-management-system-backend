package:
  individually: true
  patterns:
    - '!node_modules/**'
    - '!.serverless/**'
    - '!scripts/**'
    - '!tests/**'
    - '!docs/**'
    - '!.git/**'
    - '!.github/**'
    - '!coverage/**'
    - '!*.md'

resources:
  Resources:
    # ============ COGNITO USER POOL ============
    CognitoUserPool:
      Type: AWS::Cognito::UserPool
      DeletionPolicy: Retain
      Properties:
        UserPoolName: pg-mgmt-user-pool-${self:provider.stage}
        UsernameAttributes:
          - email
        AutoVerifiedAttributes:
          - email
        Schema:
          - Name: email
            AttributeDataType: String
            Mutable: false
          - Name: name
            AttributeDataType: String
            Mutable: true
          - Name: phone_number
            AttributeDataType: String
            Mutable: true
          - Name: picture
            AttributeDataType: String
            Mutable: true
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireUppercase: true
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: true

    CognitoUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      DependsOn: CognitoUserPoolIdentityProviderGoogle
      DeletionPolicy: Retain
      Properties:
        ClientName: pg-mgmt-client-${self:provider.stage}
        UserPoolId: !Ref CognitoUserPool
        GenerateSecret: false
        RefreshTokenValidity: 3650
        TokenValidityUnits:
          RefreshToken: days
        ExplicitAuthFlows:
          - ADMIN_NO_SRP_AUTH
          - USER_PASSWORD_AUTH
        PreventUserExistenceErrors: ENABLED
        SupportedIdentityProviders:
          - COGNITO
          - Google
        AllowedOAuthFlows:
          - code
        AllowedOAuthScopes:
          - email
          - openid
          - profile
        AllowedOAuthFlowsUserPoolClient: true
        CallbackURLs:
          - http://localhost:5173/auth/callback
          - https://dev.gobanqo.com/auth/callback
          - https://qa.gobanqo.com/auth/callback
          - https://gobanqo.com/auth/callback
        LogoutURLs:
          - http://localhost:5173/login
          - https://dev.gobanqo.com/login
          - https://qa.gobanqo.com/login
          - https://gobanqo.com/login

    # CognitoUserPoolDomain:
    #   Type: AWS::Cognito::UserPoolDomain
    #   Properties:
    #     Domain: ${self:custom.cognitoDomain.${self:provider.stage}}
    #     UserPoolId: !Ref CognitoUserPool

    CognitoUserPoolIdentityProviderGoogle:
      Type: AWS::Cognito::UserPoolIdentityProvider
      DeletionPolicy: Retain
      Properties:
        ProviderName: Google
        ProviderType: Google
        UserPoolId: !Ref CognitoUserPool
        ProviderDetails:
          client_id: "1057172668359-o9o1l6moa659flrhdjhr7nsnitfq1gvb.apps.googleusercontent.com"
          client_secret: "${env:GOOGLE_CLIENT_SECRET, 'GOCSPX-placeholder-secret-value'}"
          authorize_scopes: "email profile openid"
        AttributeMapping:
          email: "email"
          name: "name"
          picture: "picture"

    # ============ DYNAMODB TABLES ============
    
    # Users Table
    UsersTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: ${self:service}-users-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
          - AttributeName: cognitoUserId
            AttributeType: S
          - AttributeName: emailLowerCase
            AttributeType: S
          - AttributeName: userTypeIndex
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: CognitoUserIdIndex
            KeySchema:
              - AttributeName: cognitoUserId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: EmailIndex
            KeySchema:
              - AttributeName: emailLowerCase
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: UserTypeIndex
            KeySchema:
              - AttributeName: userTypeIndex
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        Tags:
          - Key: Environment
            Value: ${self:provider.stage}
          - Key: Service
            Value: ${self:service}

    # Properties Table
    PropertiesTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: ${self:service}-properties-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: propertyId
            AttributeType: S
          - AttributeName: ownerIdIndex
            AttributeType: S
          - AttributeName: statusIndex
            AttributeType: S
        KeySchema:
          - AttributeName: propertyId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: OwnerIdIndex
            KeySchema:
              - AttributeName: ownerIdIndex
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: StatusIndex
            KeySchema:
              - AttributeName: statusIndex
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        Tags:
          - Key: Environment
            Value: ${self:provider.stage}
          - Key: Service
            Value: ${self:service}

    # Rooms Table
    RoomsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: ${self:service}-rooms-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: roomId
            AttributeType: S
          - AttributeName: propertyIdIndex
            AttributeType: S
          - AttributeName: statusIndex
            AttributeType: S
        KeySchema:
          - AttributeName: roomId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: PropertyIdIndex
            KeySchema:
              - AttributeName: propertyIdIndex
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: StatusIndex
            KeySchema:
              - AttributeName: statusIndex
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        Tags:
          - Key: Environment
            Value: ${self:provider.stage}
          - Key: Service
            Value: ${self:service}
    
    # Tenants Table
    TenantsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: ${self:service}-tenants-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: tenantId
            AttributeType: S
          - AttributeName: propertyIdIndex
            AttributeType: S
          - AttributeName: roomIdIndex
            AttributeType: S
          - AttributeName: userIdIndex
            AttributeType: S
          - AttributeName: statusIndex
            AttributeType: S
        KeySchema:
          - AttributeName: tenantId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: PropertyIdIndex
            KeySchema:
              - AttributeName: propertyIdIndex
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: RoomIdIndex
            KeySchema:
              - AttributeName: roomIdIndex
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: UserIdIndex
            KeySchema:
              - AttributeName: userIdIndex
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: StatusIndex
            KeySchema:
              - AttributeName: statusIndex
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        Tags:
          - Key: Environment
            Value: ${self:provider.stage}
          - Key: Service
            Value: ${self:service}

    # Bed Assignments Table
    BedAssignmentsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: ${self:service}-bed-assignments-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: assignmentId
            AttributeType: S
          - AttributeName: roomIdIndex
            AttributeType: S
          - AttributeName: tenantIdIndex
            AttributeType: S
        KeySchema:
          - AttributeName: assignmentId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: RoomIdIndex
            KeySchema:
              - AttributeName: roomIdIndex
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: TenantIdIndex
            KeySchema:
              - AttributeName: tenantIdIndex
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        Tags:
          - Key: Environment
            Value: ${self:provider.stage}
          - Key: Service
            Value: ${self:service}

    # S3 Bucket for KYC Documents
    KYCDocumentsBucket:
      Type: AWS::S3::Bucket
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        BucketName: ${self:custom.kycBucketName}
        CorsConfiguration:
          CorsRules:
            - AllowedOrigins: ${self:custom.allowedCorsOrigins}
              AllowedMethods:
                - GET
                - PUT
                - POST
                - DELETE
              AllowedHeaders:
                - '*'
              MaxAge: 3000
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        LifecycleConfiguration:
          Rules:
            - Id: DeleteOldDocuments
              Status: Enabled
              ExpirationInDays: 365
        Tags:
          - Key: Environment
            Value: ${self:provider.stage}
          - Key: Service
            Value: ${self:service}

    # Rent Payments Table
    RentPaymentsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: ${self:service}-rent-payments-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: paymentId
            AttributeType: S
          - AttributeName: tenantIdIndex
            AttributeType: S
          - AttributeName: propertyIdIndex
            AttributeType: S
          - AttributeName: paymentMonthIndex
            AttributeType: S
          - AttributeName: statusIndex
            AttributeType: S
        KeySchema:
          - AttributeName: paymentId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: TenantIdIndex
            KeySchema:
              - AttributeName: tenantIdIndex
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: PropertyIdIndex
            KeySchema:
              - AttributeName: propertyIdIndex
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: PaymentMonthIndex
