  activateAccount:
    handler: src/functions/auth/activateAccount.handler
    events:
      - http:
          path: auth/activate-account
          method: post
          cors: *corsConfig


  getProfile:
    handler: src/functions/auth/getProfile.handler
    events:
      - http:
          path: auth/profile
          method: get
          cors: *corsConfig

          authorizer:
            name: authorizer
            resultTtlInSeconds: 0
            identitySource: method.request.header.Authorization
            type: token

  updateProfile:
    handler: src/functions/auth/updateProfile.handler
    events:
      - http:
          path: auth/profile
          method: put
          cors: *corsConfig

          authorizer:
            name: authorizer
            resultTtlInSeconds: 0
            identitySource: method.request.header.Authorization
            type: token

  # ============ PRIVACY & SECURITY ENDPOINTS ============
  getConsent:
    handler: src/functions/privacy/getConsent.handler
    events:
      - http:
          path: privacy/consent
          method: get
