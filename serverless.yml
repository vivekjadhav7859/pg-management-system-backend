    events:
      - http:
          path: properties/{propertyId}/complaints
          method: post
          cors: true
          authorizer:
            name: authorizer
            resultTtlInSeconds: 0
            identitySource: method.request.header.Authorization
            type: token

  getComplaints:
    handler: src/functions/complaints/getComplaints.handler
    events:
      - http:
          path: properties/{propertyId}/complaints
          method: get
          cors: true
          authorizer:
            name: authorizer
            resultTtlInSeconds: 0
