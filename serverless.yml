    events:
      - http:
          path: financial/expenses/{expenseId}
          method: delete
          cors: true

          authorizer:
            name: authorizer
            resultTtlInSeconds: 0
            identitySource: method.request.header.Authorization
            type: token

  # ============ FINANCIAL MANAGEMENT - REPORTS ============
  generateReport:
