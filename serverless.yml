service: pg-management-backend
frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-south-1
  stage: ${opt:stage, 'dev'}

  environment:
    STAGE: ${self:provider.stage}
    USER_POOL_ID: !Ref CognitoUserPool
    USER_POOL_CLIENT_ID: !Ref CognitoUserPoolClient

  logs:
    httpApi: true

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminInitiateAuth
            - cognito-idp:AdminSetUserPassword
            - cognito-idp:AdminGetUser
            - cognito-idp:GetUser
            - cognito-idp:GlobalSignOut
            - cognito-idp:AdminRespondToAuthChallenge
          Resource: "*"

build:
  esbuild:
    bundle: true
    minify: true
    sourcemap: false
    target: node20
    platform: node
    exclude:
      - aws-sdk

functions:
  signup:
    handler: src/functions/auth/signup.handler
    events:
      - http:
          path: auth/signup
          method: post
          cors: true

  login:
    handler: src/functions/auth/login.handler
    events:
      - http:
          path: auth/login
          method: post
          cors: true

  refreshToken:
    handler: src/functions/auth/refreshToken.handler
    events:
      - http:
          path: auth/refresh
          method: post
          cors: true

  logout:
    handler: src/functions/auth/logout.handler
    events:
      - http:
          path: auth/logout
          method: post
          cors: true

  verifyToken:
    handler: src/functions/auth/verifyToken.handler
    events:
      - http:
          path: auth/verify
          method: get
          cors: true

package:
  individually: true
  patterns:
    - '!node_modules/aws-sdk/**'
    - '!node_modules/.prisma/**'
    - '!node_modules/@aws-sdk/**'
    - '!tests/**'
    - '!docs/**'
    - '!.git/**'
    - '!.github/**'
    - '!coverage/**'
    - '!*.md'

resources:
  Resources:
    CognitoUserPool:
      Type: AWS::Cognito::UserPool
      DeletionPolicy: Delete
      Properties:
        UserPoolName: pg-mgmt-user-pool-${self:provider.stage}
        UsernameAttributes:
          - email
        AutoVerifiedAttributes:
          - email
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireUppercase: true
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: true

    CognitoUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      DeletionPolicy: Delete
      Properties:
        ClientName: pg-mgmt-client-${self:provider.stage}
        UserPoolId: !Ref CognitoUserPool
        GenerateSecret: false
        ExplicitAuthFlows:
          - ADMIN_NO_SRP_AUTH
          - USER_PASSWORD_AUTH
        PreventUserExistenceErrors: ENABLED

  Outputs:
    UserPoolId:
      Value: !Ref CognitoUserPool
    UserPoolClientId:
      Value: !Ref CognitoUserPoolClient
