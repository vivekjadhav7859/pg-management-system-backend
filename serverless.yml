      Properties:
        TableName: ${self:service}-property-invite-codes-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: propertyId
            AttributeType: S
          - AttributeName: code
            AttributeType: S
        KeySchema:
          - AttributeName: propertyId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: CodeIndex
            KeySchema:
              - AttributeName: code
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        Tags:
          - Key: Stage
            Value: ${self:provider.stage}

    # ============ KMS KEY FOR SMTP CREDENTIALS ============
    SmtpCredentialsKey:
      Type: AWS::KMS::Key
      DeletionPolicy: Retain
      Properties:
        Description: KMS key for encrypting owner SMTP credentials
        EnableKeyRotation: true
        KeyPolicy:
          Version: '2012-10-17'
          Statement:
            - Sid: EnableIAMUserPermissions
              Effect: Allow
              Principal:
                AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
              Action: "kms:*"
              Resource: "*"

    SmtpCredentialsKeyAlias:
      Type: AWS::KMS::Alias
      Properties:
        AliasName: alias/pg-management-smtp-${self:provider.stage}
        TargetKeyId: !Ref SmtpCredentialsKey

