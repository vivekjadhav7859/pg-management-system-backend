# "org" ensures this Service is used with the correct Serverless Framework Access Key.
# org: shoukat
service: pg-management-backend

custom:
  kycBucketName: ${self:service}-kyc-documents-${self:provider.stage}
  cognitoDomain:
    dev: gobanqodev
    qa: pg-mgmt-auth-qa-ap-south-1
    prod: pg-mgmt-auth-prod-ap-south-1
  allowedCorsOrigins:
    - https://gobanqo.com
    - https://www.gobanqo.com
    - https://dm2ue9mo1yuef.cloudfront.net
    - http://localhost:5173
    - http://localhost:5174
    - http://localhost:3000
    - http://127.0.0.1:5173
    - http://127.0.0.1:3000
  corsConfig: &corsConfig
    origins: ${self:custom.allowedCorsOrigins}
    headers:
      - Content-Type
      - X-Amz-Date
      - Authorization
      - X-Api-Key
      - X-Amz-Security-Token
    allowCredentials: true
  prune:
    automatic: true
    number: 3
  splitStacks:
    custom: splits.js

plugins:
  - ./scripts/remove-log-groups-plugin.js
  - serverless-plugin-split-stacks

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-south-1
  stage: ${opt:stage, 'dev'}
  apiName: ${self:service}-${self:provider.stage}-v2
  deploymentBucket: ${env:DEPLOYMENT_BUCKET, 'serverless-framework-deployments-ap-south-1-5fca437e-9fb3'}
  # Keep functions on $LATEST. Publishing a version for every function adds one
  # CloudFormation resource each and pushes this stack past AWS's 500-resource limit.
  versionFunctions: false


  environment:
    STAGE: ${self:provider.stage}
    USER_POOL_ID: !Ref CognitoUserPool
    USER_POOL_CLIENT_ID: !Ref CognitoUserPoolClient
    USER_TABLE: ${self:service}-users-${self:provider.stage}
    PROPERTY_TABLE: ${self:service}-properties-${self:provider.stage}
    ROOM_TABLE: ${self:service}-rooms-${self:provider.stage}
    TENANT_TABLE: ${self:service}-tenants-${self:provider.stage}
    BED_ASSIGNMENT_TABLE: ${self:service}-bed-assignments-${self:provider.stage}
    S3_BUCKET: ${self:custom.kycBucketName}
    RENT_PAYMENT_TABLE: ${self:service}-rent-payments-${self:provider.stage}
    EXPENSE_TABLE: ${self:service}-expenses-${self:provider.stage}
    REMINDER_SETTINGS_TABLE: ${self:service}-reminder-settings-${self:provider.stage}
    NOTIFICATION_TABLE: ${self:service}-notifications-${self:provider.stage}
    COMPLAINTS_TABLE: ${self:service}-complaints-${self:provider.stage}
    INVITE_CODE_TABLE: ${self:service}-property-invite-codes-${self:provider.stage}
    EMAIL_LOG_TABLE: ${self:service}-email-logs-${self:provider.stage}
    POLICY_ACCEPTANCE_LOG_TABLE: ${self:service}-policy-logs-${self:provider.stage}
    AUDIT_LOG_TABLE: ${self:service}-audit-logs-${self:provider.stage}
    USER_CONSENT_TABLE: ${self:service}-user-consents-${self:provider.stage}
    DATA_REQUEST_TABLE: ${self:service}-data-requests-${self:provider.stage}
    SUBSCRIPTION_TABLE: ${self:service}-subscriptions-${self:provider.stage}
    WEBHOOK_EVENT_TABLE: ${self:service}-webhook-events-${self:provider.stage}
    KMS_KEY_ID: !Ref SmtpCredentialsKey
    FRONTEND_URL: ${env:FRONTEND_URL, 'http://localhost:5173'}
    SES_FROM_EMAIL: ${env:SES_FROM_EMAIL, 'noreply@gobanqo.com'}
    SES_REGION: ${self:provider.region}
    ALLOWED_CORS_ORIGINS: ${env:ALLOWED_CORS_ORIGINS, 'https://gobanqo.com,https://www.gobanqo.com,https://dev.gobanqo.com,https://qa.gobanqo.com,https://dm2ue9mo1yuef.cloudfront.net,http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000'}
    SUBSCRIPTION_TRIAL_DAYS: ${env:SUBSCRIPTION_TRIAL_DAYS, '30'}
    SUBSCRIPTION_TRIAL_PROPERTY_LIMIT: ${env:SUBSCRIPTION_TRIAL_PROPERTY_LIMIT, '1'}
    RAZORPAY_KEY_ID: ${env:RAZORPAY_KEY_ID, ''}
    RAZORPAY_KEY_SECRET: ${env:RAZORPAY_KEY_SECRET, ''}
    RAZORPAY_WEBHOOK_SECRET: ${env:RAZORPAY_WEBHOOK_SECRET, ''}
    PLAN_BASIC_ANNUAL_AMOUNT: ${env:PLAN_BASIC_ANNUAL_AMOUNT, '299900'}
    PLAN_SILVER_ANNUAL_AMOUNT: ${env:PLAN_SILVER_ANNUAL_AMOUNT, '499900'}
    PLAN_GOLD_ANNUAL_AMOUNT: ${env:PLAN_GOLD_ANNUAL_AMOUNT, '799900'}
    PLAN_PLATINUM_ANNUAL_AMOUNT: ${env:PLAN_PLATINUM_ANNUAL_AMOUNT, '1199900'}
    VAPID_PUBLIC_KEY: ${env:VAPID_PUBLIC_KEY, 'BLoZ4JFQk6qq0UVqh-6yxEDm6mH1HbRwHpkiw6lMUPigOkivUUJ4SI7J8KHWJccdyDWzn-cdIq2z6vwbYzoU4Io'}
    VAPID_PRIVATE_KEY: ${env:VAPID_PRIVATE_KEY, 'rsBVKQW9UkEICpFp9zZlEdRPrmiEFSqnSywdzGs_gsE'}
    VAPID_SUBJECT: ${env:VAPID_SUBJECT, 'mailto:support@gobanqo.com'}



  logs:
    httpApi: true

  iam:
    role:
      statements:
        # Cognito permissions
        - Effect: Allow
          Action:
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminInitiateAuth
            - cognito-idp:AdminSetUserPassword
            - cognito-idp:AdminGetUser
            - cognito-idp:GetUser
            - cognito-idp:GlobalSignOut
            - cognito-idp:AdminRespondToAuthChallenge
            - cognito-idp:AdminLinkProviderForUser
            - cognito-idp:ListUsers
          Resource: "*"
        
        # DynamoDB permissions
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:TransactWriteItems
          Resource:
            - !GetAtt UsersTable.Arn
            - !Sub "${UsersTable.Arn}/index/*"
            - !GetAtt PropertiesTable.Arn
            - !Sub "${PropertiesTable.Arn}/index/*"
            - !GetAtt RoomsTable.Arn
            - !Sub "${RoomsTable.Arn}/index/*"
            - !GetAtt TenantsTable.Arn
            - !Sub "${TenantsTable.Arn}/index/*"
            - !GetAtt BedAssignmentsTable.Arn
            - !Sub "${BedAssignmentsTable.Arn}/index/*"
            - !GetAtt RentPaymentsTable.Arn
            - !Sub "${RentPaymentsTable.Arn}/index/*"
            - !GetAtt ExpensesTable.Arn
            - !Sub "${ExpensesTable.Arn}/index/*"
            - !GetAtt ReminderSettingsTable.Arn
            - !Sub "${ReminderSettingsTable.Arn}/index/*"
            - !GetAtt NotificationsTable.Arn
            - !Sub "${NotificationsTable.Arn}/index/*"
            - !GetAtt ComplaintsTable.Arn
            - !Sub "${ComplaintsTable.Arn}/index/*"
            - !GetAtt PropertyInviteCodesTable.Arn
            - !Sub "${PropertyInviteCodesTable.Arn}/index/*"
            - !GetAtt EmailLogsTable.Arn
            - !Sub "${EmailLogsTable.Arn}/index/*"
            - !Sub "arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-policy-logs-${self:provider.stage}"
            - !Sub "arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-policy-logs-${self:provider.stage}/index/*"
            - !Sub "arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-audit-logs-${self:provider.stage}"
            - !Sub "arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-audit-logs-${self:provider.stage}/index/*"
            - !Sub "arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-user-consents-${self:provider.stage}"
            - !Sub "arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-user-consents-${self:provider.stage}/index/*"
            - !Sub "arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-data-requests-${self:provider.stage}"
            - !Sub "arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-data-requests-${self:provider.stage}/index/*"
            - !Sub "arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-subscriptions-${self:provider.stage}"
            - !Sub "arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-subscriptions-${self:provider.stage}/index/*"
            - !Sub "arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-webhook-events-${self:provider.stage}"
            - !Sub "arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-webhook-events-${self:provider.stage}/index/*"

        # DynamoDB Streams read permission
        - Effect: Allow
          Action:
            - dynamodb:GetRecords
            - dynamodb:GetShardIterator
            - dynamodb:DescribeStream
            - dynamodb:ListStreams
          Resource:
            - !GetAtt TenantsTable.StreamArn
          
        # S3 permissions
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource:
            - !Sub "${KYCDocumentsBucket.Arn}/*"
        
        # SES permissions for email reminders (kept for backward compat)
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          Resource: "*"
        
        # KMS permissions for SMTP credential encryption
        - Effect: Allow
          Action:
            - kms:Encrypt
            - kms:Decrypt
            - kms:GenerateDataKey
          Resource: !GetAtt SmtpCredentialsKey.Arn

build:
  esbuild:
    bundle: true
    minify: true
    sourcemap: false
    target: node20
    platform: node
    # Keep packaging stable in local and CI environments by limiting the
    # number of Lambda functions esbuild processes at the same time.
    buildConcurrency: 3

functions:
  cognitoPreSignUp:
    handler: src/functions/auth/preSignUp.handler
    events:
      - cognitoUserPool:
          pool: pg-mgmt-user-pool-${self:provider.stage}
          trigger: PreSignUp
          existing: true

  cognitoCustomMessage:
    handler: src/functions/auth/customMessage.handler
    events:
      - cognitoUserPool:
          pool: pg-mgmt-user-pool-${self:provider.stage}
          trigger: CustomMessage
          existing: true

  authorizer:
    handler: src/functions/auth/authorizer.handler
  # ============ AUTH ENDPOINTS ============
  signup:
    handler: src/functions/auth/signup.handler
    events:
      - http:
          path: auth/signup
          method: post
          cors: *corsConfig

  login:
    handler: src/functions/auth/login.handler
    events:
      - http:
          path: auth/login
          method: post
          cors: *corsConfig

  refreshToken:
    handler: src/functions/auth/refreshToken.handler
    events:
      - http:
          path: auth/refresh
          method: post
          cors: *corsConfig

  logout:
