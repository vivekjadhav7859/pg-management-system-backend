    # ============ KMS KEY FOR SMTP CREDENTIALS ============
    SmtpCredentialsKey:
      Type: AWS::KMS::Key
      DeletionPolicy: Retain
      Properties:
        Description: KMS key for encrypting owner SMTP credentials
        EnableKeyRotation: true
        KeyPolicy:
          Version: '2012-10-17'
          Statement:
            - Sid: EnableIAMUserPermissions
              Effect: Allow
              Principal:
                AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
              Action: "kms:*"
              Resource: "*"

    SmtpCredentialsKeyAlias:
      Type: AWS::KMS::Alias
      Properties:
        AliasName: alias/pg-management-smtp-${self:provider.stage}
        TargetKeyId: !Ref SmtpCredentialsKey

