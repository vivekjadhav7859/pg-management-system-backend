  # ============ REMINDER MANAGEMENT ============
  sendReminder:
    handler: src/functions/financial/sendReminder.handler
    timeout: 15
    events:
      - http:
          path: financial/send-reminder
          method: post
          cors: true

          authorizer:
            name: authorizer
            resultTtlInSeconds: 0
            identitySource: method.request.header.Authorization
            type: token

  testSmtpCredentials:
    handler: src/functions/financial/testCredentials.handler
    timeout: 15
    events:
      - http:
          path: properties/{propertyId}/reminder-settings/test
          method: post
          cors: true

          authorizer:
            name: authorizer
            resultTtlInSeconds: 0
            identitySource: method.request.header.Authorization
            type: token

  getReminderSettings:
    handler: src/functions/financial/getReminderSettings.handler
    events:
