  getExpenses:
    handler: src/functions/financial/getExpenses.handler
    events:
      - http:
          path: properties/{propertyId}/expenses
          method: get
          cors: true

          authorizer:
            name: authorizer
            resultTtlInSeconds: 0
            identitySource: method.request.header.Authorization
            type: token

  updateExpense:
    handler: src/functions/financial/updateExpense.handler
    events:
