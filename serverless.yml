service: pg-management-backend
frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-south-1
  stage: ${opt:stage, 'dev'}

  environment:
    STAGE: ${self:provider.stage}
    USER_POOL_ID: !Ref CognitoUserPool
    USER_POOL_CLIENT_ID: !Ref CognitoUserPoolClient
    AWS_REGION: ${self:provider.region}

  logs:
    httpApi: true   # ✅ prevents manual log group conflicts

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminInitiateAuth
            - cognito-idp:AdminSetUserPassword
            - cognito-idp:AdminGetUser
            - cognito-idp:GetUser
            - cognito-idp:GlobalSignOut
            - cognito-idp:AdminRespondToAuthChallenge
          Resource: "*"

build:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node20
    platform: node
    exclude:
      - aws-sdk

functions:
  signup:
    handler: src/functions/auth/signup.handler
    events:
      - http:
          path: auth/signup
          method: post
          cors: true

  login:
    handler: src/functions/auth/login.handler
    events:
      - http:
          path: auth/login
          method: post
          cors: true

  refreshToken:
    handler: src/functions/auth/refreshToken.handler
    events:
      - http:
          path: auth/refresh
          method: post
          cors: true

  logout:
    handler: src/functions/auth/logout.handler
    events:
      - http:
          path: auth/logout
          method: post
          cors: true

  verifyToken:
    handler: src/functions/auth/verifyToken.handler
    events:
      - http:
          path: auth/verify
          method: get
          cors: true

resources:
  Resources:

    CognitoUserPool:
      Type: AWS::Cognito::UserPool
      DeletionPolicy: Delete     # ✅ CRITICAL for DEV
      Properties:
        UserPoolName: pg-mgmt-user-pool-${self:provider.stage}
        UsernameAttributes:
          - email
        AutoVerifiedAttributes:
          - email
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireUppercase: true
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: true
        AccountRecoverySetting:
          RecoveryMechanisms:
            - Name: verified_email
              Priority: 1
        UserPoolTags:
          Environment: ${self:provider.stage}
          Service: pg-management

    CognitoUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      DeletionPolicy: Delete     # ✅ prevents UPDATE_FAILED
      Properties:
        ClientName: pg-mgmt-client-${self:provider.stage}
        UserPoolId: !Ref CognitoUserPool
        GenerateSecret: false
        ExplicitAuthFlows:
          - ADMIN_NO_SRP_AUTH
          - ALLOW_USER_PASSWORD_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH

        PreventUserExistenceErrors: ENABLED
        AccessTokenValidity: 60
        IdTokenValidity: 60
        RefreshTokenValidity: 30
        TokenValidityUnits:
          AccessToken: minutes
          IdToken: minutes
          RefreshToken: days

  Outputs:
    UserPoolId:
      Value: !Ref CognitoUserPool

    UserPoolClientId:
      Value: !Ref CognitoUserPoolClient
