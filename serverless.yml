service: pg-management-backend
frameworkVersion: '4'


provider:
  name: aws
  runtime: nodejs20.x
  region: ap-south-1
  stage: ${opt:stage, 'dev'}

  environment:
    STAGE: ${self:provider.stage}
    USER_POOL_ID: !Ref CognitoUserPool
    USER_POOL_CLIENT_ID: !Ref CognitoUserPoolClient
    USER_TABLE: ${self:service}-users-${self:provider.stage}
service: pg-management-backend
frameworkVersion: '4'


provider:
  name: aws
  runtime: nodejs20.x
  region: ap-south-1
  stage: ${opt:stage, 'dev'}

  environment:
    STAGE: ${self:provider.stage}
    USER_POOL_ID: !Ref CognitoUserPool
    USER_POOL_CLIENT_ID: !Ref CognitoUserPoolClient
    USER_TABLE: ${self:service}-users-${self:provider.stage}
    PROPERTY_TABLE: ${self:service}-properties-${self:provider.stage}
    ROOM_TABLE: ${self:service}-rooms-${self:provider.stage}
    TENANT_TABLE: ${self:service}-tenants-${self:provider.stage}
    BED_ASSIGNMENT_TABLE: ${self:service}-bed-assignments-${self:provider.stage}
    S3_BUCKET: ${self:service}-kyc-documents-${self:provider.stage}
    RENT_PAYMENT_TABLE: ${self:service}-rent-payments-${self:provider.stage}
    EXPENSE_TABLE: ${self:service}-expenses-${self:provider.stage}
    REMINDER_SETTINGS_TABLE: ${self:service}-reminder-settings-${self:provider.stage}
    NOTIFICATION_TABLE: ${self:service}-notifications-${self:provider.stage}
    KMS_KEY_ID: !Ref SmtpCredentialsKey
    SES_FROM_EMAIL: ${env:SES_FROM_EMAIL, 'noreply@pgmanagement.com'}
    SES_REGION: ${self:provider.region}

  logs:
    httpApi: true

  iam:
    role:
      statements:
        # Cognito permissions
        - Effect: Allow
          Action:
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminInitiateAuth
            - cognito-idp:AdminSetUserPassword
            - cognito-idp:AdminGetUser
            - cognito-idp:GetUser
            - cognito-idp:GlobalSignOut
            - cognito-idp:AdminRespondToAuthChallenge
          Resource: "*"
        
        # DynamoDB permissions
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - !GetAtt UsersTable.Arn
            - !Sub "${UsersTable.Arn}/index/*"
            - !GetAtt PropertiesTable.Arn
            - !Sub "${PropertiesTable.Arn}/index/*"
            - !GetAtt RoomsTable.Arn
            - !Sub "${RoomsTable.Arn}/index/*"
            - !GetAtt TenantsTable.Arn
            - !Sub "${TenantsTable.Arn}/index/*"
            - !GetAtt BedAssignmentsTable.Arn
            - !Sub "${BedAssignmentsTable.Arn}/index/*"
            - !GetAtt RentPaymentsTable.Arn
            - !Sub "${RentPaymentsTable.Arn}/index/*"
            - !GetAtt ExpensesTable.Arn
            - !Sub "${ExpensesTable.Arn}/index/*"
            - !GetAtt ReminderSettingsTable.Arn
            - !Sub "${ReminderSettingsTable.Arn}/index/*"
            - !GetAtt NotificationsTable.Arn
            - !Sub "${NotificationsTable.Arn}/index/*"
          
        # S3 permissions
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource:
            - !Sub "${KYCDocumentsBucket.Arn}/*"
        
        # SES permissions for email reminders (kept for backward compat)
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          Resource: "*"
        
        # KMS permissions for SMTP credential encryption
        - Effect: Allow
          Action:
            - kms:Encrypt
            - kms:Decrypt
            - kms:GenerateDataKey
          Resource: !GetAtt SmtpCredentialsKey.Arn

build:
  esbuild:
    bundle: true
    minify: true
    sourcemap: false
    target: node20
    platform: node
    exclude:
      - aws-sdk

functions:
  authorizer:
    handler: src/functions/auth/authorizer.handler
      Properties:
        UserPoolName: pg-mgmt-user-pool-${self:provider.stage}
        UsernameAttributes:
          - email
        AutoVerifiedAttributes:
          - email
        Schema:
          - Name: email
            AttributeDataType: String
            Mutable: false
          - Name: name
            AttributeDataType: String
            Mutable: true
          - Name: phone_number
            AttributeDataType: String
            Mutable: true
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireUppercase: true
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: true

    CognitoUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      DeletionPolicy: Retain
      Properties:
        ClientName: pg-mgmt-client-${self:provider.stage}
        UserPoolId: !Ref CognitoUserPool
        GenerateSecret: false
        ExplicitAuthFlows:
          - ADMIN_NO_SRP_AUTH
          - USER_PASSWORD_AUTH
        PreventUserExistenceErrors: ENABLED

    # ============ DYNAMODB TABLES ============
    
    # Users Table
    UsersTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: ${self:service}-users-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
          - AttributeName: cognitoUserId
            AttributeType: S
          - AttributeName: emailLowerCase
            AttributeType: S
          - AttributeName: userTypeIndex
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: CognitoUserIdIndex
            KeySchema:
              - AttributeName: cognitoUserId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: EmailIndex
            KeySchema:
              - AttributeName: emailLowerCase
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: UserTypeIndex
            KeySchema:
              - AttributeName: userTypeIndex
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        Tags:
          - Key: Environment
            Value: ${self:provider.stage}
          - Key: Service
            Value: ${self:service}

    # Properties Table
    PropertiesTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: ${self:service}-properties-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: propertyId
            AttributeType: S
          - AttributeName: ownerIdIndex
            AttributeType: S
          - AttributeName: statusIndex
            AttributeType: S
        KeySchema:
          - AttributeName: propertyId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: OwnerIdIndex
            KeySchema:
              - AttributeName: ownerIdIndex
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: StatusIndex
            KeySchema:
              - AttributeName: statusIndex
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        Tags:
          - Key: Environment
            Value: ${self:provider.stage}
          - Key: Service
            Value: ${self:service}

    # Rooms Table
    RoomsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: ${self:service}-rooms-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: roomId
            AttributeType: S
          - AttributeName: propertyIdIndex
            AttributeType: S
          - AttributeName: statusIndex
            AttributeType: S
        KeySchema:
          - AttributeName: roomId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: PropertyIdIndex
            KeySchema:
              - AttributeName: propertyIdIndex
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: StatusIndex
            KeySchema:
              - AttributeName: statusIndex
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        Tags:
          - Key: Environment
            Value: ${self:provider.stage}
          - Key: Service
            Value: ${self:service}
    
    # Tenants Table
    TenantsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: ${self:service}-tenants-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: tenantId
            AttributeType: S
          - AttributeName: propertyIdIndex
            AttributeType: S
          - AttributeName: roomIdIndex
            AttributeType: S
          - AttributeName: userIdIndex
            AttributeType: S
          - AttributeName: statusIndex
            AttributeType: S
        KeySchema:
          - AttributeName: tenantId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: PropertyIdIndex
            KeySchema:
              - AttributeName: propertyIdIndex
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: RoomIdIndex
            KeySchema:
              - AttributeName: roomIdIndex
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: UserIdIndex
            KeySchema:
              - AttributeName: userIdIndex
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: StatusIndex
            KeySchema:
              - AttributeName: statusIndex
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        Tags:
          - Key: Environment
            Value: ${self:provider.stage}
          - Key: Service
            Value: ${self:service}

    # Bed Assignments Table
    BedAssignmentsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: ${self:service}-bed-assignments-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: assignmentId
            AttributeType: S
          - AttributeName: roomIdIndex
            AttributeType: S
          - AttributeName: tenantIdIndex
            AttributeType: S
        KeySchema:
          - AttributeName: assignmentId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: RoomIdIndex
            KeySchema:
              - AttributeName: roomIdIndex
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: TenantIdIndex
            KeySchema:
              - AttributeName: tenantIdIndex
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        Tags:
          - Key: Environment
            Value: ${self:provider.stage}
          - Key: Service
            Value: ${self:service}

    # S3 Bucket for KYC Documents
    KYCDocumentsBucket:
      Type: AWS::S3::Bucket
      DeletionPolicy: Retain
      Properties:
        BucketName: ${self:service}-kyc-documents-${self:provider.stage}
        CorsConfiguration:
          CorsRules:
            - AllowedOrigins:
                - '*'
              AllowedMethods:
                - GET
                - PUT
                - POST
                - DELETE
              AllowedHeaders:
                - '*'
              MaxAge: 3000
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        LifecycleConfiguration:
          Rules:
            - Id: DeleteOldDocuments
              Status: Enabled
              ExpirationInDays: 365
        Tags:
          - Key: Environment
            Value: ${self:provider.stage}
          - Key: Service
            Value: ${self:service}

    # Rent Payments Table
    RentPaymentsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: ${self:service}-rent-payments-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: paymentId
            AttributeType: S
          - AttributeName: tenantIdIndex
            AttributeType: S
          - AttributeName: propertyIdIndex
            AttributeType: S
          - AttributeName: paymentMonthIndex
            AttributeType: S
          - AttributeName: statusIndex
            AttributeType: S
        KeySchema:
          - AttributeName: paymentId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: TenantIdIndex
            KeySchema:
              - AttributeName: tenantIdIndex
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: PropertyIdIndex
            KeySchema:
              - AttributeName: propertyIdIndex
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: PaymentMonthIndex
            KeySchema:
              - AttributeName: paymentMonthIndex
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: StatusIndex
            KeySchema:
              - AttributeName: statusIndex
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        Tags:
          - Key: Environment
            Value: ${self:provider.stage}
          - Key: Service
            Value: ${self:service}

    # Expenses Table
    ExpensesTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: ${self:service}-expenses-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: expenseId
            AttributeType: S
          - AttributeName: propertyIdIndex
            AttributeType: S
          - AttributeName: expenseMonthIndex
            AttributeType: S
          - AttributeName: expenseTypeIndex
            AttributeType: S
        KeySchema:
          - AttributeName: expenseId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: PropertyIdIndex
            KeySchema:
              - AttributeName: propertyIdIndex
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: ExpenseMonthIndex
            KeySchema:
              - AttributeName: expenseMonthIndex
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: ExpenseTypeIndex
            KeySchema:
              - AttributeName: expenseTypeIndex
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        Tags:
          - Key: Environment
            Value: ${self:provider.stage}
          - Key: Service
            Value: ${self:service}

    # Reminder Settings Table
    ReminderSettingsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: ${self:service}-reminder-settings-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: propertyId
            AttributeType: S
        KeySchema:
          - AttributeName: propertyId
            KeyType: HASH
        Tags:
          - Key: Environment
            Value: ${self:provider.stage}
          - Key: Service
            Value: ${self:service}

    # ============ KMS KEY FOR SMTP CREDENTIALS ============
    SmtpCredentialsKey:
      Type: AWS::KMS::Key
      DeletionPolicy: Retain
      Properties:
        Description: KMS key for encrypting owner SMTP credentials
        EnableKeyRotation: true
        KeyPolicy:
          Version: '2012-10-17'
          Statement:
            - Sid: EnableIAMUserPermissions
              Effect: Allow
              Principal:
                AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
              Action: "kms:*"
              Resource: "*"

    SmtpCredentialsKeyAlias:
      Type: AWS::KMS::Alias
      Properties:
        AliasName: alias/pg-management-smtp-${self:provider.stage}
        TargetKeyId: !Ref SmtpCredentialsKey

  Outputs:
    UserPoolId:
      Description: Cognito User Pool ID
      Value: !Ref CognitoUserPool
      Export:
        Name: ${self:service}-UserPoolId-${self:provider.stage}
    
    UserPoolClientId:
      Description: Cognito User Pool Client ID
      Value: !Ref CognitoUserPoolClient
      Export:
        Name: ${self:service}-UserPoolClientId-${self:provider.stage}
    
    UsersTableName:
      Description: DynamoDB Users Table Name
      Value: !Ref UsersTable
      Export:
        Name: ${self:service}-UsersTable-${self:provider.stage}
    
    PropertiesTableName:
      Description: DynamoDB Properties Table Name
      Value: !Ref PropertiesTable
      Export:
        Name: ${self:service}-PropertiesTable-${self:provider.stage}
    
    RoomsTableName:
      Description: DynamoDB Rooms Table Name
      Value: !Ref RoomsTable
      Export:
        Name: ${self:service}-RoomsTable-${self:provider.stage}

    TenantsTableName:
      Description: DynamoDB Tenants Table Name
      Value: !Ref TenantsTable
      Export:
        Name: ${self:service}-TenantsTable-${self:provider.stage}
    
    BedAssignmentsTableName:
      Description: DynamoDB Bed Assignments Table Name
      Value: !Ref BedAssignmentsTable
      Export:
        Name: ${self:service}-BedAssignmentsTable-${self:provider.stage}
    
    KYCDocumentsBucketName:
      Description: S3 Bucket for KYC Documents
      Value: !Ref KYCDocumentsBucket
      Export:
        Name: ${self:service}-KYCBucket-${self:provider.stage}

    RentPaymentsTableName:
      Description: DynamoDB Rent Payments Table Name
      Value: !Ref RentPaymentsTable
      Export:
        Name: ${self:service}-RentPaymentsTable-${self:provider.stage}
    
    ExpensesTableName:
      Description: DynamoDB Expenses Table Name
      Value: !Ref ExpensesTable
      Export:
        Name: ${self:service}-ExpensesTable-${self:provider.stage}
    
    ReminderSettingsTableName:
      Description: DynamoDB Reminder Settings Table Name
      Value: !Ref ReminderSettingsTable
      Export:
        Name: ${self:service}-ReminderSettingsTable-${self:provider.stage}

    SmtpCredentialsKeyId:
      Description: KMS Key ID for SMTP credential encryption
      Value: !Ref SmtpCredentialsKey
      Export:
        Name: ${self:service}-SmtpCredentialsKey-${self:provider.stage}
